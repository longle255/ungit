<!-- ko if: isShowingDiffs -->
<div class="textdiff">
  <!-- ko if: diffTooLarge -->
  <div class="diff-too-large">
    <p>Diff is too large to display (<span data-bind="text: diffSize"></span> bytes).</p>
    <button class="btn btn-default load-full-diff" data-bind="click: loadFullDiff">
      Load full diff anyway
    </button>
  </div>
  <!-- /ko -->
  <!-- ko if: isParsed -->
  <div
    data-bind="template: {nodes: ko.utils.parseHtmlFragment(htmlSrc)}, css: {'word-wrap': wordWrap.value}"
  ></div>
  <!-- /ko -->
  <div class="load-more" data-bind="visible: hasMore">
    <button class="btn btn-default" data-bind="click: loadMore">Load more</button>
  </div>
</div>
<!-- /ko -->
